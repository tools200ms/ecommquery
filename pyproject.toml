
[tool.poetry]
name = "ecommquery"
version = "0.1.0"
description = "AI integration framework."
authors = ["barnaba@200ms.net"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/tools200ms/ecommquery"
repository = "https://github.com/tools200ms/ecommquery"
keywords = ["ai", "api", "python"]

[tool.poetry.dependencies]
python = "^3.8"
bs4 = "^4.12.3"

prestapyt = "^0.11.1" # Ensure this is the latest version of prestapyt
openai = "^1.60.1"

unidecode = "^1.3.8"
validators = "^0.34.0"

[tool.poetry.dev-dependencies]
pytest = "^7.4" # For testing
black = "^23.0" # For code formatting
flake8 = "^6.1" # For linting
isort = "^5.12" # For import sorting
mypy = "^1.5"   # For type checking

[build-system]
requires = ["poetry-core>=1.4.0"]
build-backend = "poetry.core.masonry.api"
