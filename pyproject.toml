[build-system]
requires = ["poetry-core>=1.4.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
name = "ecommquery"
version = "0.1.0"
description = "AI integration framework."
authors = ["Mateusz Piwek <barnaba@200ms.net>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/tools200ms/ecommquery"
repository = "https://github.com/tools200ms/ecommquery"
keywords = ["ai", "api", "ecommerce", "integrations", "python"]

[tool.poetry.scripts]
cmd = "ecommquery.__main__:main"

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
prestapyt = "^0.11.1"
beautifulsoup4 = "^4.12.3"
requests = "^2.32.3"
unidecode = "^1.3.8"
urllib3 = "^2.3.0"
openai = "^1.60.2"
packaging = "^24.2"
validators = "^0.34.0"
peewee = "^3.18.3"

[poetry.group.dev.dependencies]
pytest = "^7.4" # For testing
black = "^23.0" # For code formatting
flake8 = "^6.1" # For linting
isort = "^5.12" # For import sorting
mypy = "^1.5"   # For type checking

